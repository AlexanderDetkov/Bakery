[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bakery"
version = "0.1.0"
description = "Prompt Baking — a clean, agent-extensible research codebase"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44,<5",  # 5.x changes apply_chat_template(tokenize=True) to return a BatchEncoding; build_prefix_ids expects an id list
    "peft>=0.11",
    "datasets>=2.18",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# Analysis deps are SEPARATE from the training stack on purpose: an analysis turn
# (or a Claude Code agent reading results) must never need to import torch/peft.
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
analysis = ["matplotlib>=3.8", "pandas>=2.0"]

[project.scripts]
bakery = "bakery.runner:main"

[tool.setuptools.packages.find]
include = ["bakery*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: end-to-end runs that load a model (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
